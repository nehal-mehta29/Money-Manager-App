<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Manager App</title>

    <!--Connecting to CSS-->
    <link rel="stylesheet" href="style.css">

    <!--Font Awesome icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!--Importing the google font-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <!--Connecting to Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

    <!--------------------------------------------- Container for main app --------------------------------------------->
    <div id="app-container">

        <!--======================================== Header ========================================-->
        <header id="header">
            <h1>Money Manager</h1>

            <!--Adding Header buttons-->
            <div id="header-buttons">

                <!--Adding add transaction button-->
                <button id="add-trans">
                    <i class="fa-solid fa-plus"></i> Add Transaction
                </button>
            
                <!--Adding button to download CSV-->
                <button id="download-CSV">
                    <i class="fa-solid fa-download"></i>Download CSV
                </button>
            </div>
        </header>

        <!--======================================== Financial Summary Section ========================================-->
        <section id="financial-summary">

            <!--Total Income card-->
            <div id="total-income-card">
                <h2>Total Income</h2>
                <p id="total-income"><i class="fa-solid fa-indian-rupee-sign"></i> 0.00</p>
            </div>

            <!--Toatal Expenses card-->
            <div id="total-expense-card">
                <h2>Total Expense</h2>
                <p id="total-expense"><i class="fa-solid fa-indian-rupee-sign"></i> 0.00</p>
            </div>

            <!--Net Balance card-->
            <div id="net-balance-card">
                <h2>Net Balance</h2>
                <p id="net-balance"><i class="fa-solid fa-indian-rupee-sign"></i> 0.00</p>
            </div>
        </section> 

        <!--======================================== Filter Transaction section ========================================-->
        <section id="filter-section">
            <h2>Fliter Transaction</h2>

            <div id="filter-container">
                
                <!--To select the category-->
                <div class="filter-item">
                    <label for="filter-category">Category</label>
                    <select id="filter-category">
                        <option value="All">All</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </div>

                <!--To select the sub-category-->
                <div class="filter-item">
                    <label for="filter-subcategory">Sub-Category</label>
                    <select id="filter-subcategory">
                        <option value="All">All</option>
                    </select>
                </div>

                <!--To select the from date-->
                <div class="filter-item">
                    <label for="filter-date-from">Date From</label>
                    <input type="date" id="filter-date-from"/>
                </div>

                <!--To select the to date-->
                <div class="filter-item">
                    <label for="filter-date-to">Date To</label>
                    <input type="date" id="filter-date-to"/>
                </div>
            </div>

            <!--Button to clear filters-->
            <div id="clear-filter-container">
                <button id="clear-filter-btn">Clear Filters</button>
            </div>
        </section>  
        
        <!--======================================== Transaction History Section ========================================-->
        <section id="transaction-history">
            <div class="transaction-header">
                <h2>Transaction History</h2>

                <!--To sort-->
                <div class="sort-item">
                    <label for="sort-by">Sort By: </label>
                    <select id="sort-by">
                        <option value="date-desc">Date (Newest)</option>
                        <option value="date-asc">Date (Oldest)</option>
                        <option value="amount-desc">Amount (Highest)</option>
                        <option value="amount-asc">Amount (Lowest)</option>
                    </select>
                </div>
            </div>

            <!--Creating table to show transaction-->
            <div id="trans-container">
                <table id="trans-table">

                    <!--Transaction columns-->
                    <thead>

                        <!--Header for the columns-->
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Sub-Category</th>
                            <th>Amount</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="trans-list">
                        <!--Transaction rows-->
                    </tbody>
                </table>

            </div>
        </section>

        <!--======================================== Income vs Expense chart ========================================-->
        <section id="chart-section">
            <h2>Income vs Expense</h2>

            <!--Chart Section container-->
            <div id="chart-container">
                <canvas id="balanceChart"></canvas>
            </div>
        </section>
    </div>

    <!--------------------------------------------- Add/Edit Transaction Modal --------------------------------------------->
    <div id="trans-form" class="modal-overlay hidden">
        <div id="add-content">

            <div id="form-header">
                <h2>Add Transaction</h2>
                <button id="close-button" aria-label="close form">
                <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!--Creating Add/Edit transaction form-->
            <form id="add-trans-form">
            
                <!--Giving a transaction ID to each added/edited transaction (which is hidden)-->
                <input type="hidden" id="trans-id">

                <div class="form-group">

                    <!--To add amount-->
                    <div class="form-field-container">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" name="amount">
                    </div>

                    <!--To add date of transaction-->
                    <div class="form-field-container">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date">
                    </div>

                    <!--To add category-->
                    <div class="form-field-container">
                        <label>Category</label>

                        <!--Options-->
                        <div id="category-options">
                            <label>
                                <input type="radio" id="income" name="category" value="Income">Income
                            </label>

                            <label>
                                <input type="radio" id="expense" name="category" value="Expense">Expense
                            </label>
                        </div>
                    </div>

                    <!--To add sub-category-->
                    <div class="form-field-container">
                        <label for="sub-category">Sub-Category</label>
                        <select id="sub-category" name="sub-category">
                            <option value="">--Select a sub-category--</option>
                        </select>
                    </div>

                    <!--To add description-->
                    <div class="form-field-container">
                        <label for="description">Description (Optional)</label>
                        <input type="text" id="description" name="description">
                    </div>

                    <!--Submit button-->
                    <div id="form-submit-container">
                        <button type="submit" id="submit-btn">Add Transaction</button>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <!--------------------------------------------- Confirmation modal for deletion --------------------------------------------->
    <div id="confirmation-modal" class="modal-overlay hidden">
        <div id="confirmation-modal-content">
            <h2>Confirm Deletion</h2>

            <!--Displaying a confirmation message to delete the respective transaction-->
            <p>Are you sure you want to delete this transaction?</p>

            <!--Confirmation button-->
            <div id="confirmation-buttons">
                <button id="cancel-btn">Cancel</button>
                <button id="delete-btn">Delete</button>
            </div>
        </div>
    </div> 

    <!--Connecting to JS-->
    <script type="module" src="app.js"></script>
</body>
</html>
